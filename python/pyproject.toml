[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "korays-framework"
version = "0.1.0"
description = "Koray-Style Topical Authority Stack"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "fpdf2>=2.7.0",
]

[project.scripts]
korays = "pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["korays*"]
